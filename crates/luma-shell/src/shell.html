<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luma Next</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f7f7f7; color: #1b1b1b; }
    body { display: grid; grid-template-rows: 48px minmax(0, 1fr); border: 1px solid #d8d8d8; }
    button { font: inherit; }
    .titlebar { display: grid; grid-template-columns: minmax(120px, 1fr) auto auto 1px auto auto auto; align-items: center; background: #fbfbfb; user-select: none; }
    .drag { height: 100%; display: flex; align-items: center; padding-left: 17px; font-size: 14px; font-weight: 500; }
    .tool, .caption { height: 46px; border: 0; background: transparent; color: #3a3a3a; display: grid; place-items: center; }
    .tool { width: 40px; border-radius: 6px; }
    .caption { width: 46px; }
    .tool:hover, .caption:hover { background: #ededed; }
    .caption.close:hover { color: white; background: #c42b1c; }
    .tool:focus-visible, .caption:focus-visible, .retry:focus-visible { outline: 2px solid #005fb8; outline-offset: -2px; }
    .divider { width: 1px; height: 20px; background: #e2e2e2; margin: 0 2px; }
    svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    main { position: relative; min-height: 0; background: white; border-top: 1px solid #e5e5e5; }
    iframe { width: 100%; height: 100%; border: 0; background: white; display: none; }
    .status { position: absolute; inset: 0; display: grid; place-items: center; padding: 32px; background: #fafafa; }
    .status[hidden] { display: none; }
    .message { width: min(430px, 100%); text-align: center; }
    .signal { width: 44px; height: 44px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: #f0f0f0; color: #666; }
    h1 { margin: 0; font-size: 20px; line-height: 1.35; font-weight: 600; }
    p { margin: 9px auto 20px; max-width: 390px; font-size: 13px; line-height: 1.65; color: #666; }
    code { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; }
    .retry { min-width: 96px; height: 34px; padding: 0 18px; border: 1px solid #c8c8c8; border-radius: 5px; background: #fff; color: #1b1b1b; font-weight: 500; }
    .retry:hover { background: #f2f2f2; }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="drag" id="drag-region">录制</div>
    <button class="tool" id="open-recordings" title="打开录像目录" aria-label="打开录像目录">
      <svg viewBox="0 0 20 20"><path d="M2.5 5.5h6l1.6 2h7.4v7.5a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 15z"/><path d="M2.5 8h15"/></svg>
    </button>
    <button class="tool" id="settings" title="设置（待接线）" aria-label="设置">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4"/></svg>
    </button>
    <span class="divider"></span>
    <button class="caption" data-command="window:minimize" title="最小化" aria-label="最小化"><svg viewBox="0 0 20 20"><path d="M5 14.5h10"/></svg></button>
    <button class="caption" id="maximize" data-command="window:toggle-maximize" title="最大化" aria-label="最大化"><svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10"/></svg></button>
    <button class="caption close" data-command="window:close" title="关闭" aria-label="关闭"><svg viewBox="0 0 20 20"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg></button>
  </header>
  <main>
    <iframe id="engine" title="Luma WebUI"></iframe>
    <section class="status" id="status" aria-live="polite">
      <div class="message">
        <div class="signal"><svg viewBox="0 0 20 20"><path d="M3 10a7 7 0 0 1 12-4.9L17 7M17 3v4h-4M17 10a7 7 0 0 1-12 4.9L3 13M3 17v-4h4"/></svg></div>
        <h1 id="status-title">正在连接 Luma 引擎</h1>
        <p id="status-copy">检查本机 <code>127.0.0.1:18765</code>。首次启动可能需要片刻。</p>
        <button class="retry" id="retry">重试</button>
      </div>
    </section>
  </main>
  <script>
    const send = command => window.ipc.postMessage(command);
    document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => send(button.dataset.command)));
    document.getElementById('open-recordings').addEventListener('click', () => send('shell:open-recordings'));
    document.getElementById('settings').addEventListener('click', () => {
      document.getElementById('status-title').textContent = '设置入口尚未接线';
      document.getElementById('status-copy').textContent = '壳已保留设置按钮；待 WebUI 提供稳定路由后接入。';
      document.getElementById('status').hidden = false;
    });
    document.getElementById('retry').addEventListener('click', () => {
      document.getElementById('status-title').textContent = '正在重新连接';
      document.getElementById('status-copy').innerHTML = '检查本机 <code>127.0.0.1:18765</code>。';
      send('shell:retry');
    });
    const drag = document.getElementById('drag-region');
    drag.addEventListener('mousedown', event => {
      if (event.button !== 0) return;
      send(event.detail === 2 ? 'window:toggle-maximize' : 'window:drag');
    });
    window.lumaShell = {
      setEngineReady(ready, origin) {
        const frame = document.getElementById('engine');
        const status = document.getElementById('status');
        if (ready) {
          if (!frame.src) frame.src = `${origin}/`;
          frame.style.display = 'block';
          status.hidden = true;
        } else {
          frame.style.display = 'none';
          status.hidden = false;
          document.getElementById('status-title').textContent = '无法连接 Luma 引擎';
          document.getElementById('status-copy').innerHTML = '请先运行 <code>cargo run -p luma-engine</code>，确认端口 <code>18765</code> 可用后重试。';
        }
      },
      setMaximized(maximized) {
        const button = document.getElementById('maximize');
        button.title = maximized ? '还原' : '最大化';
        button.setAttribute('aria-label', button.title);
        button.innerHTML = maximized
          ? '<svg viewBox="0 0 20 20"><rect x="4" y="7" width="9" height="9"/><path d="M7 7V4h9v9h-3"/></svg>'
          : '<svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10"/></svg>';
      }
    };
  </script>
</body>
</html>
