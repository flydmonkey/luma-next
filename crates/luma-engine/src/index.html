<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luma Next</title>
  <style>
    :root { font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", sans-serif; color: #1b1b1b; background: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 36px; background: #fff; }
    main { width: min(560px, 100%); }
    .connection { display: flex; align-items: center; gap: 9px; color: #256d1b; font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #2d7d21; }
    .connection.recording { color: #a4262c; }
    .connection.recording .dot { background: #c42b1c; box-shadow: 0 0 0 4px #f8d7d4; }
    .timer { margin: 28px 0 2px; font-size: clamp(44px, 9vw, 64px); line-height: 1; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.035em; }
    .mode { margin: 12px 0 28px; color: #666; font-size: 13px; line-height: 1.55; }
    .action { min-width: 148px; height: 40px; padding: 0 20px; border: 1px solid #b8b8b8; border-radius: 6px; background: #fff; color: #1b1b1b; font: 600 14px inherit; }
    .action:hover { background: #f4f4f4; }
    .action.primary { border-color: #b3261e; background: #c42b1c; color: #fff; }
    .action.primary:hover { background: #b3261e; }
    .action:disabled { opacity: .55; cursor: wait; }
    .action:focus-visible { outline: 2px solid #005fb8; outline-offset: 2px; }
    .details { margin-top: 38px; padding-top: 18px; border-top: 1px solid #e5e5e5; }
    .row { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; padding: 6px 0; font-size: 12px; line-height: 1.5; }
    .label { color: #777; }
    .value { min-width: 0; overflow-wrap: anywhere; }
    .error { margin-top: 18px; padding: 10px 12px; border-left: 3px solid #c42b1c; background: #fdf3f2; color: #8e1f18; font-size: 12px; line-height: 1.55; }
    .error[hidden], .details[hidden] { display: none; }
    @media (max-width: 560px) { body { place-items: start; padding: 28px 22px; } .timer { margin-top: 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="connection" id="connection"><span class="dot"></span><span id="connection-copy">本机引擎已连接</span></div>
    <div class="timer" id="timer">00:00:00</div>
    <p class="mode">主显示器 · 系统音频 · 最高 1920×1080 / 30fps</p>
    <button class="action primary" id="action">开始录制</button>
    <div class="error" id="error" hidden></div>
    <section class="details" id="details" hidden>
      <div class="row"><span class="label">输出文件</span><span class="value" id="output">—</span></div>
      <div class="row"><span class="label">验证</span><span class="value" id="validation">等待停止后验证</span></div>
    </section>
  </main>
  <script>
    const action = document.getElementById('action');
    const connection = document.getElementById('connection');
    const connectionCopy = document.getElementById('connection-copy');
    const timer = document.getElementById('timer');
    const errorBox = document.getElementById('error');
    const details = document.getElementById('details');
    const output = document.getElementById('output');
    const validation = document.getElementById('validation');
    let session = { state: 'idle', elapsed_seconds: 0 };

    const formatTime = seconds => {
      const total = Math.max(0, Math.floor(seconds || 0));
      return [Math.floor(total / 3600), Math.floor(total / 60) % 60, total % 60]
        .map(value => String(value).padStart(2, '0')).join(':');
    };

    function render(next) {
      session = next;
      const recording = next.state === 'recording';
      connection.classList.toggle('recording', recording);
      connectionCopy.textContent = recording ? '正在录制' : next.state === 'failed' ? '录制失败' : '本机引擎已连接';
      timer.textContent = formatTime(next.elapsed_seconds);
      action.textContent = recording ? '停止并验证' : '开始录制';
      action.classList.toggle('primary', !recording);
      if (next.output_path) {
        details.hidden = false;
        output.textContent = next.output_path;
      }
      if (next.validation) {
        const value = next.validation;
        validation.textContent = `视频 + 音频 · ${value.duration_seconds.toFixed(2)} 秒 · ${value.encoded_frames} 帧 · ${(value.bytes / 1048576).toFixed(1)} MB`;
      } else if (recording) {
        validation.textContent = '录制中；停止后检查文件、音视频流和时长';
      }
      errorBox.hidden = !next.error;
      errorBox.textContent = next.error || '';
    }

    async function request(path, options) {
      const response = await fetch(path, options);
      const envelope = await response.json();
      if (!response.ok || !envelope.ok) throw new Error(envelope.error || `请求失败（${response.status}）`);
      return envelope.data;
    }

    async function refresh() {
      try { render(await request('/api/v1/session')); }
      catch (error) { errorBox.hidden = false; errorBox.textContent = `无法读取会话：${error.message}`; }
    }

    action.addEventListener('click', async () => {
      action.disabled = true;
      errorBox.hidden = true;
      try {
        const path = session.state === 'recording' ? '/api/v1/session/stop' : '/api/v1/session/start';
        render(await request(path, { method: 'POST' }));
      } catch (error) {
        errorBox.hidden = false;
        errorBox.textContent = error.message;
        await refresh();
      } finally {
        action.disabled = false;
      }
    });

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
